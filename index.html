<title>Escritório Rua 9</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Identidade Rua 9: preto, off-white, vermelho e azul-noite, DM Sans. Layout: palco isométrico + painel da equipe. */
:root{
  --bg:#0a0a0a; --surface:#141417; --surface2:#1c1c21; --fg:#f5f4f0; --muted:#a5a6a8; --line:#343436;
  --accent:#d90429; --accent-fg:#ffffff; --focus:#8b8fd0; --danger:#ff6b81; --blue:#2b2d42;
  --sky1:#1d1e27; --sky2:#0a0a0a;
  --font:'DM Sans',Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f4f0; --surface:#ffffff; --surface2:#efeee9; --fg:#0a0a0a; --muted:#5f6065; --line:#d9d8d3;
    --focus:#2b2d42; --danger:#b3001f; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f5f4f0; --surface:#ffffff; --surface2:#efeee9; --fg:#0a0a0a; --muted:#5f6065; --line:#d9d8d3;
  --focus:#2b2d42; --danger:#b3001f; color-scheme:light;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font); font-size:14px; line-height:1.45;
  padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{max-width:1280px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;gap:14px;align-items:flex-end}
.brand svg{height:48px;width:auto;fill:var(--fg);flex:none}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h1{font-size:30px;line-height:1.05;margin:0;letter-spacing:-.02em;font-weight:500;text-wrap:balance}
h1 b{font-weight:700}
.clockbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
#clock{font-size:24px;font-weight:500;letter-spacing:.02em}
.sw{display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--muted)}
.sw input{width:16px;height:16px;accent-color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{border:1px solid var(--line);border-radius:14px;overflow-x:auto;background:linear-gradient(var(--sky1),var(--sky2))}
canvas{display:block}
.under{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i,.chip i,.seg i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--c,#888)}
#note{min-height:20px;color:var(--fg);font-weight:500;margin:0}
.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px 16px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -4px 12px}
.tabs button{background:none;border:0;padding:12px 12px 10px;color:var(--muted);font-weight:600;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
h2.sec{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec:first-child{margin-top:4px}
h2.sec span{letter-spacing:.04em;text-transform:none;font-size:12px}
.empty{color:var(--muted);margin:6px 0}
.row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.row.on{border-color:var(--accent)}
.row:hover{border-color:var(--line)}
.row.on:hover{border-color:var(--accent)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.av.lg{width:44px;height:44px;font-size:18px}
.rt{min-width:0;display:flex;flex-direction:column}
.rt b,.rt small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt small{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 20%,transparent)}
.st-atendendo{--c:#22a56b}.st-gravando{--c:#d90429}.st-pausa{--c:#e39a0b}.st-reuniao{--c:#6f7bdc}.st-fora{--c:#8b94a3}
.detail{border:1px solid var(--accent);border-radius:12px;padding:12px;margin-bottom:6px;background:var(--surface2)}
.dh{display:flex;gap:10px;align-items:center}
.dfields{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input[type=text],input[type=time]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;width:100%}
.dfields input:first-of-type{font-weight:700}
.desc{color:var(--muted);margin:10px 0}
.lbl{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button:last-child:nth-child(odd){grid-column:1 / -1}
.seg button{display:flex;gap:7px;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px;cursor:pointer;font-weight:500}
.seg button.on{border-color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
.hours{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.hours label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.dact{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.mesa{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.card .r{color:var(--muted);font-size:12px;font-weight:600}
.card p{margin:2px 0 0;color:var(--muted);grid-column:1}
.card .btn{grid-column:2;grid-row:1 / span 2}
.custom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.custom .btn{grid-column:1 / -1}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.log time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface2);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:28px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px;font-weight:600}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:320px}
th,td{padding:6px 5px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fine{font-size:12px;color:var(--muted);margin:12px 0 0}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 180 345" aria-hidden="true"><path d="M139.567 254.641C152.747 248.57 167.781 258.198 167.781 272.708L32.2139 335.152C19.0345 341.223 4.00027 331.595 4 317.085L139.567 254.641ZM139.764 190.003C152.873 184.016 167.781 193.597 167.781 208.009L32.0186 270.018C18.9094 276.005 4 266.424 4 252.012L139.764 190.003ZM89.918 0C137.172 7.03285e-05 175.48 37.6472 175.48 84.0869C175.48 115.896 157.507 143.578 130.997 157.864C130.962 157.905 130.929 157.948 130.894 157.989L31.583 207.351C18.8945 213.657 4 204.427 4 190.258L62.2178 163.667C28.5585 152.354 4.3566 120.999 4.35645 84.0869C4.35645 37.6473 42.6637 0.000208809 89.918 0ZM88.4434 29.5039C58.2984 29.504 33.8604 53.281 33.8604 82.6113C33.8604 111.942 58.2983 135.719 88.4434 135.719C118.588 135.719 143.025 111.942 143.025 82.6113C143.025 53.2812 118.588 29.5042 88.4434 29.5039Z"/></svg>
      <div>
        <p class="eyebrow">R9 / Estúdio Independente</p>
        <h1>Escritório <b>Rua 9</b></h1>
      </div>
    </div>
    <div class="clockbox">
      <span id="clock" class="num" aria-label="Hora atual">--:--</span>
      <label class="sw"><input type="checkbox" id="auto"> Seguir horário de expediente</label>
    </div>
  </header>

  <main class="layout">
    <section aria-label="Estúdio">
      <div class="stage" id="stage">
        <canvas id="cv" role="img" aria-label="Estúdio isométrico da Rua 9 com a equipe trabalhando nas ilhas de edição e no set de gravação. Use a aba Equipe para gerenciar os funcionários."></canvas>
      </div>
      <div class="under">
        <div class="legend" aria-label="Legenda de situações">
          <span class="st-atendendo"><i></i>Em produção</span>
          <span class="st-gravando"><i></i>Gravando</span>
          <span class="st-pausa"><i></i>Pausa</span>
          <span class="st-reuniao"><i></i>Reunião</span>
          <span class="st-fora"><i></i>Fora</span>
        </div>
        <p id="note" role="status"></p>
      </div>
    </section>

    <aside class="side">
      <div class="tabs" role="tablist" aria-label="Painel">
        <button role="tab" id="t-team" aria-selected="true" aria-controls="p-team">Equipe</button>
        <button role="tab" id="t-log" aria-selected="false" aria-controls="p-log">Avisos</button>
        <button role="tab" id="t-rep" aria-selected="false" aria-controls="p-rep">Relatório</button>
      </div>
      <div id="p-team" role="tabpanel" aria-labelledby="t-team"></div>
      <div id="p-log" role="tabpanel" aria-labelledby="t-log" hidden></div>
      <div id="p-rep" role="tabpanel" aria-labelledby="t-rep" hidden></div>
    </aside>
  </main>
</div>

<script>
(function(){
'use strict';
var LW=880,LH=580,UNIT=34,W=14,H=12,OX=412,OY=130;
var STORE='rua9-escritorio-v1';
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var $=function(s){return document.querySelector(s)};
var FONT='"DM Sans",Arial,sans-serif';
var SYM=new Path2D('M139.567 254.641C152.747 248.57 167.781 258.198 167.781 272.708L32.2139 335.152C19.0345 341.223 4.00027 331.595 4 317.085L139.567 254.641ZM139.764 190.003C152.873 184.016 167.781 193.597 167.781 208.009L32.0186 270.018C18.9094 276.005 4 266.424 4 252.012L139.764 190.003ZM89.918 0C137.172 7.03285e-05 175.48 37.6472 175.48 84.0869C175.48 115.896 157.507 143.578 130.997 157.864C130.962 157.905 130.929 157.948 130.894 157.989L31.583 207.351C18.8945 213.657 4 204.427 4 190.258L62.2178 163.667C28.5585 152.354 4.3566 120.999 4.35645 84.0869C4.35645 37.6473 42.6637 0.000208809 89.918 0ZM88.4434 29.5039C58.2984 29.504 33.8604 53.281 33.8604 82.6113C33.8604 111.942 58.2983 135.719 88.4434 135.719C118.588 135.719 143.025 111.942 143.025 82.6113C143.025 53.2812 118.588 29.5042 88.4434 29.5039Z');
var STATUS={
  atendendo:{label:'Em produção',color:'#22a56b'},
  gravando:{label:'Gravando',color:'#d90429'},
  pausa:{label:'Pausa',color:'#e39a0b'},
  reuniao:{label:'Reunião',color:'#6f7bdc'},
  fora:{label:'Fora',color:'#8b94a3'}
};
var CATALOG=[
  {id:'lia',name:'Lia',role:'Direção Criativa',desc:'Conduz o diagnóstico criativo, define a ideia central e cuida da linguagem de cada projeto.'},
  {id:'theo',name:'Theo',role:'Direção de Cena',desc:'Dirige no set: enquadramento, atuação e ritmo de cada take.'},
  {id:'nina',name:'Nina',role:'Captação',desc:'Câmera, luz e som. Monta o set e garante a imagem.'},
  {id:'caio',name:'Caio',role:'Montagem e Finalização',desc:'Edita, corrige a cor e entrega nos formatos 16:9 e 9:16.'},
  {id:'rafa',name:'Rafa',role:'Atendimento Comercial',desc:'Responde contatos em minutos, explica os pacotes Essencial, Performance e Autoridade Total e agenda o diagnóstico.'},
  {id:'bia',name:'Bia',role:'Roteiro',desc:'Escreve manifestos de marca, roteiros de séries e chamadas para redes.'}
];
var SHIRTS=['#d90429','#6f7bdc','#e0e0d8','#e39a0b','#22a56b','#c46bd1','#3a9bb0','#f08a5d'];
var HAIRS=['#1a1411','#4a2f1c','#c9a24a','#0f0f12','#8b3a1b'];
var SKINS=['#f1c9a5','#d9a077','#a96c47','#7a4a2e'];
var LEADS=['Clínica pede série de autoridade','Marca quer um filme institucional','Especialista quer o pacote Performance','Evento pede cobertura com criativos','Empresa quer um manifesto de marca','Dra. Camila pede orçamento Autoridade Total'];
var ENTREGAS=['Corte v2 pronto para revisão','Roteiro aprovado','Cor finalizada','Entrega 9:16 exportada','Trilha aprovada'];
var SETMSG=['Luz ajustada','Som limpo','Take 7 aprovado','Mais um take','Enquadramento fechado'];

/* ---------- mesas e pontos do estúdio ---------- */
var DESKS=[];[3,6].forEach(function(gy){[2,5,8,11].forEach(function(gx){DESKS.push({gx:gx,gy:gy})})});
function seat(i){var d=DESKS[i];return {x:d.gx+1,y:d.gy+1.4,cx:d.gx,cy:d.gy+1}}
var SET=[[10.5,11.5],[8.5,10.5],[12.5,9.5],[9.5,11.5],[11.5,11.5]];
var PAUSE=[[6.5,10.5],[7.5,10.5],[12.5,11.5],[13.5,11.5],[12.5,10.5]];
var MEET=[[1.5,9.5],[5.5,10.5],[3.5,8.5],[3.5,11.5],[1.5,10.5],[5.5,9.5]];
var DOOR={x:12.5,y:0.5,cx:12,cy:0};
var PLANTS=[[0,2],[0,6],[13,8],[5,11]];
var blocked=[];for(var j=0;j<H;j++){blocked.push(new Array(W).fill(false))}
function block(x,y,w,d){for(var b=y;b<y+d;b++)for(var a=x;a<x+w;a++)blocked[b][a]=true}
DESKS.forEach(function(d){block(d.gx,d.gy,2,1)});
block(9,0,3,1);block(2,9,3,2);block(9,9,3,2);block(13,10,1,1);block(6,11,2,1);
PLANTS.forEach(function(p){block(p[0],p[1],1,1)});

function bfs(from,to){
  var key=function(c){return c[1]*W+c[0]};
  var prev={},q=[from],seen={};seen[key(from)]=1;
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){
    var c=q.shift();
    if(c[0]===to[0]&&c[1]===to[1]){
      var path=[c];while(key(path[0])!==key(from)){path.unshift(prev[key(path[0])])}
      return path;
    }
    for(var i=0;i<4;i++){
      var n=[c[0]+dirs[i][0],c[1]+dirs[i][1]];
      if(n[0]<0||n[1]<0||n[0]>=W||n[1]>=H||seen[key(n)])continue;
      if(blocked[n[1]][n[0]]&&!(n[0]===to[0]&&n[1]===to[1]))continue;
      seen[key(n)]=1;prev[key(n)]=c;q.push(n);
    }
  }
  return null;
}
var cellOf=function(x,y){return [Math.max(0,Math.min(W-1,Math.floor(x))),Math.max(0,Math.min(H-1,Math.floor(y)))]};

/* ---------- desenho ---------- */
var P=function(x,y,z){return [OX+(x-y)*32,OY+(x+y)*16-(z||0)*UNIT]};
function shade(hex,k){
  var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  var f=function(v){return Math.max(0,Math.min(255,Math.round(v*k)))};
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function poly(c,pts,fill,stroke){
  c.beginPath();
  for(var i=0;i<pts.length;i++){if(i)c.lineTo(pts[i][0],pts[i][1]);else c.moveTo(pts[i][0],pts[i][1])}
  c.closePath();c.fillStyle=fill;c.fill();
  if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke()}
}
var EDGE='rgba(0,0,0,.35)';
function box(c,x,y,z,w,d,h,top,side){
  side=side||top;
  poly(c,[P(x,y+d,z+h),P(x+w,y+d,z+h),P(x+w,y+d,z),P(x,y+d,z)],shade(side,.84),EDGE);
  poly(c,[P(x+w,y,z+h),P(x+w,y+d,z+h),P(x+w,y+d,z),P(x+w,y,z)],shade(side,.64),EDGE);
  poly(c,[P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],top,EDGE);
}
function onWall(c,side,a,ztop,fn){
  var p=side==='R'?P(a,0,ztop):P(0,a,ztop);
  c.save();
  if(side==='R')c.transform(.32,.16,0,.34,p[0],p[1]);else c.transform(.32,-.16,0,.34,p[0],p[1]);
  fn(c);c.restore();
}
function reel(c,side,a,w,v){
  onWall(c,side,a,2.75,function(c){
    var ww=w*100;
    c.fillStyle='#0a0a0a';c.fillRect(-6,-6,ww+12,162);
    var g=c.createLinearGradient(0,0,ww,150);
    if(v){g.addColorStop(0,'#2b2d42');g.addColorStop(1,'#d90429')}else{g.addColorStop(0,'#d90429');g.addColorStop(1,'#2b2d42')}
    c.fillStyle=g;c.fillRect(0,0,ww,150);
    c.fillStyle='rgba(255,255,255,.16)';
    c.beginPath();c.moveTo(ww*.55,0);c.lineTo(ww*.8,0);c.lineTo(ww*.35,150);c.lineTo(ww*.1,150);c.closePath();c.fill();
    c.fillStyle='rgba(10,10,10,.55)';c.beginPath();c.arc(ww/2,75,26,0,7);c.fill();
    c.fillStyle='#f5f4f0';c.beginPath();c.moveTo(ww/2-8,60);c.lineTo(ww/2+14,75);c.lineTo(ww/2-8,90);c.closePath();c.fill();
    c.fillStyle='#f5f4f0';c.font='600 11px '+FONT;c.textBaseline='alphabetic';c.fillText(v?'9:16':'16:9',10,140);
  });
}
function drawStatic(c){
  var i,j;
  for(j=0;j<H;j++)for(i=0;i<W;i++){
    var a,b;
    if(j>=8&&i>=7){a='#cfcdc6';b='#c5c3bb'}
    else if(j>=8){a='#4a4b57';b='#43444f'}
    else{a='#3a3b42';b='#34353b'}
    var col=((i+j)&1)?b:a;
    poly(c,[P(i,j),P(i+1,j),P(i+1,j+1),P(i,j+1)],col,col);
  }
  poly(c,[P(11.9,0.05),P(13.1,0.05),P(13.1,0.9),P(11.9,0.9)],'#16171c');
  /* paredes */
  poly(c,[P(0,0,0),P(W,0,0),P(W,0,3.2),P(0,0,3.2)],'#2b2d42');
  poly(c,[P(0,0,0),P(0,H,0),P(0,H,3.2),P(0,0,3.2)],'#22243a');
  poly(c,[P(0,0,0),P(W,0,0),P(W,0,.22),P(0,0,.22)],'#14151b');

  else if(eff==='gravando'){k=pickSpot(SET,e,eff);t={x:SET[k][0],y:SET[k][1],spot:k}}

/* ---------- simulação ---------- */
var last=performance.now();
function update(dt){
  var ppl=everyone();
  deskOn.fill(false);recOn=false;
  ppl.forEach(function(e){
    var eff=effStatus(e);
    if(eff!==e.lastEff){
      var was=e.lastEff;
      setTarget(e,false);
      if(was!==null&&!e.leaving&&autoHours&&((eff==='fora')!==(was==='fora')))log(e.name+(eff==='fora'?' saiu: fim do expediente.':' chegou para o expediente.'));
      if(!e.leaving)renderTeamSoon();
    }
    if(e.path&&e.path.length){
      var t=e.path[0],dx=t[0]-e.x,dy=t[1]-e.y,dist=Math.hypot(dx,dy),step=2.4*dt;
      e.moving=true;e.walkT+=dt;if(Math.abs(dx-dy)>.01)e.dir=dx-dy;
      if(dist<=step){e.x=t[0];e.y=t[1];e.path.shift();if(!e.path.length){e.moving=false;arrive(e)}}
      else{e.x+=dx/dist*step;e.y+=dy/dist*step}
    }else e.moving=false;
    if(e.sit&&e.target&&e.target.eff==='atendendo')deskOn[e.desk]=true;
    if(e.present&&!e.moving&&e.target&&e.target.eff==='gravando')recOn=true;
  });
}
var teamSoon=false;
function renderTeamSoon(){if(teamSoon)return;teamSoon=true;setTimeout(function(){teamSoon=false;renderTeam()},50)}

  var now=performance.now();
  $('#clock').textContent=hhmm();
  emps.forEach(function(e){
    var eff=effStatus(e);e.secs[eff]=(e.secs[eff]||0)+1;
    if(e.moving)return;
    var r=Math.random();
    if(eff==='atendendo'&&e.sit){
      if(isCom(e)){
        if(r<.14){
          e.leads++;
          if(Math.random()<.28){e.visitas++;e.bubble={text:'Diagnóstico marcado: terça, 15h',until:now+4200};log(e.name+' marcou uma reunião de diagnóstico (simulado).')}
          else e.bubble={text:'Lead: '+LEADS[Math.floor(Math.random()*LEADS.length)],until:now+4200};
        }
      }else if(r<.07){
        e.entregas++;e.bubble={text:ENTREGAS[Math.floor(Math.random()*ENTREGAS.length)],until:now+4200};
      }
    }else if(eff==='gravando'&&r<.08){
      e.bubble={text:SETMSG[Math.floor(Math.random()*SETMSG.length)],until:now+3600};
    }
  });
  if(!$('#p-rep').hidden)renderReport();
  saveSoon();
}
function frame(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  update(dt);draw(ts);requestAnimationFrame(frame);
}

/* ---------- painel ---------- */
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function chip(eff){return '<span class="chip st-'+eff+'"><i></i>'+STATUS[eff].label+'</span>'}
function rowHTML(e){
  return '<button class="row'+(e.id===selId?' on':'')+'" data-act="select" data-id="'+e.id+'"><span class="av" style="background:'+e.shirt+';color:'+(e.shirt==='#e0e0d8'?'#0a0a0a':'#fff')+'">'+esc(e.name.charAt(0).toUpperCase())+'</span><span class="rt"><b>'+esc(e.name)+'</b><small>'+esc(e.role)+' · Mesa '+(e.desk+1)+'</small></span>'+chip(effStatus(e))+'</button>';
}
function detailHTML(e){
  var seg=Object.keys(STATUS).map(function(k){
    return '<button class="'+(k===e.status?'on':'')+'" data-act="status" data-s="'+k+'" aria-pressed="'+(k===e.status)+'"><i style="--c:'+STATUS[k].color+'"></i>'+STATUS[k].label+'</button>';
  }).join('');
  return '<section class="detail" aria-label="Funcionário selecionado">'+
    '<div class="dh"><span class="av lg" style="background:'+e.shirt+';color:'+(e.shirt==='#e0e0d8'?'#0a0a0a':'#fff')+'">'+esc(e.name.charAt(0).toUpperCase())+'</span><div class="dfields">'+
    '<label class="sr" for="f-name">Nome</label><input type="text" id="f-name" data-field="name" value="'+esc(e.name)+'" maxlength="24">'+
    '<label class="sr" for="f-role">Função</label><input type="text" id="f-role" data-field="role" value="'+esc(e.role)+'" maxlength="40"></div></div>'+
    '<p class="desc">'+esc(e.desc)+'</p>'+
    '<div class="lbl">Situação</div><div class="seg" role="group" aria-label="Situação">'+seg+'</div>'+
    '<div class="hours"><label>Entrada<input type="time" data-field="start" value="'+e.start+'"></label><label>Saída<input type="time" data-field="end" value="'+e.end+'"></label></div>'+
    '<p class="hint">Os horários valem quando "Seguir horário de expediente" está ligado.</p>'+
    '<div class="dact"><span class="mesa">Mesa '+(e.desk+1)+'</span><button class="btn danger" data-act="fire">'+(fireArmed===e.id?'Confirmar demissão':'Demitir')+'</button></div></section>';
}
function renderTeam(){
  var el=$('#p-team'),sel=emps.filter(function(e){return e.id===selId})[0],h='';
  if(sel)h+=detailHTML(sel);
  h+='<h2 class="sec">01 / Equipe <span>'+emps.length+'/'+DESKS.length+' mesas</span></h2>';
  if(!emps.length)h+='<p class="empty">Ninguém contratado ainda. Escolha um cargo abaixo.</p>';
  emps.forEach(function(e){h+=rowHTML(e)});
  var full=emps.length>=DESKS.length;
  h+='<h2 class="sec">02 / Contratar</h2>';
  CATALOG.filter(function(c){return !emps.some(function(e){return e.key===c.id})}).forEach(function(c){
    h+='<div class="card"><div><b>'+esc(c.name)+'</b> <span class="r">'+esc(c.role)+'</span></div><p>'+esc(c.desc)+'</p><button class="btn" data-act="hire" data-key="'+c.id+'"'+(full?' disabled':'')+'>'+(full?'Sem mesa':'Contratar')+'</button></div>';
  });
  h+='<div class="lbl" style="margin-top:14px">Cargo personalizado</div><div class="custom"><label class="sr" for="c-name">Nome</label><input type="text" id="c-name" placeholder="Nome" maxlength="24"><label class="sr" for="c-role">Função</label><input type="text" id="c-role" placeholder="Função" maxlength="40"><button class="btn ghost" data-act="hire-custom"'+(full?' disabled':'')+'>Contratar</button></div>';
  var keep=el.scrollTop;el.innerHTML=h;el.scrollTop=keep;
}
function renderLog(){
  $('#p-log').innerHTML=logs.length?'<ul class="log" aria-live="polite">'+logs.map(function(l){return '<li><time>'+esc(l.t)+'</time><span>'+esc(l.m)+'</span></li>'}).join('')+'</ul>':'<p class="empty">Sem avisos ainda.</p>';
}
function fmt(s){return s<3600?Math.floor(s/60)+' min':(s/3600).toFixed(1).replace('.',',')+' h'}
var resetArmed=false;
function renderReport(){
  var L=0,V=0,E=0,A=0;emps.forEach(function(e){L+=e.leads;V+=e.visitas;E+=e.entregas;A+=e.secs.atendendo+e.secs.gravando});
  var rows=emps.map(function(e){return '<tr><td>'+esc(e.name)+'</td><td>'+e.leads+'</td><td>'+e.visitas+'</td><td>'+e.entregas+'</td><td>'+fmt(e.secs.atendendo)+'</td><td>'+fmt(e.secs.gravando)+'</td></tr>'}).join('');
  $('#p-rep').innerHTML='<div class="kpis"><div class="kpi"><b>'+L+'</b><span>Leads atendidos</span></div><div class="kpi"><b>'+V+'</b><span>Diagnósticos marcados</span></div><div class="kpi"><b>'+E+'</b><span>Entregas</span></div><div class="kpi"><b>'+fmt(A)+'</b><span>Tempo em produção</span></div></div>'+
    '<div class="tbl"><table><thead><tr><th>Nome</th><th>Leads</th><th>Diag.</th><th>Entr.</th><th>Prod.</th><th>Set</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6">Sem funcionários.</td></tr>')+'</tbody></table></div>'+
    '<p class="fine">Números simulados. Eles passam a ser reais quando os agentes forem ligados ao WhatsApp e às ferramentas do estúdio.</p>'+
    '<p style="margin-top:12px"><button class="btn ghost" data-act="reset">'+(resetArmed?'Confirmar reinício':'Reiniciar estúdio')+'</button></p>';
}
function renderAll(){renderTeam();renderLog();renderReport()}
function showTab(id){
  ['team','log','rep'].forEach(function(k){
    var on=k===id;$('#t-'+k).setAttribute('aria-selected',on);$('#p-'+k).hidden=!on;
  });
  if(id==='rep')renderReport();
}
function select(id){selId=id;fireArmed=null;showTab('team');renderTeam()}
function hire(def){
  if(emps.length>=DESKS.length)return;
  var e=newEmp(def,{desk:freeDesk()});runtime(e);emps.push(e);setTarget(e,false);
  selId=e.id;log(e.name+' entrou para a equipe pela recepção.');showTab('team');renderAll();
}
function fire(e){
  emps.splice(emps.indexOf(e),1);e.leaving=true;leaving.push(e);
  if(selId===e.id)selId=null;fireArmed=null;log(e.name+' deixou a equipe.');renderAll();
}
$('.side').addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,e=emps.filter(function(x){return x.id===selId})[0];
  if(act==='select')select(b.dataset.id);
  else if(act==='status'&&e){e.status=b.dataset.s;log(e.name+' agora está: '+STATUS[e.status].label+'.');renderTeam()}
  else if(act==='hire'){var d=CATALOG.filter(function(c){return c.id===b.dataset.key})[0];if(d)hire(d)}
  else if(act==='hire-custom'){
    var n=$('#c-name').value.trim(),r=$('#c-role').value.trim();
    if(!n){$('#c-name').focus();return}
    hire({id:'custom',name:n,role:r||'Assistente'});
  }
  else if(act==='fire'&&e){
    if(fireArmed===e.id)fire(e);
    else{fireArmed=e.id;renderTeam();setTimeout(function(){if(fireArmed===e.id){fireArmed=null;renderTeam()}},3500)}
  }
  else if(act==='reset'){
    if(resetArmed){
      resetArmed=false;try{localStorage.removeItem(STORE)}catch(_){}
      emps=[];leaving=[];logs=[];selId=null;seed();emps.forEach(function(x){runtime(x);setTarget(x,true)});renderAll();
    }else{resetArmed=true;renderReport();setTimeout(function(){resetArmed=false;if(!$('#p-rep').hidden)renderReport()},3500)}
  }
});
$('.side').addEventListener('change',function(ev){
  var f=ev.target.dataset&&ev.target.dataset.field;if(!f)return;
  var e=emps.filter(function(x){return x.id===selId})[0];if(!e)return;
  var v=ev.target.value.trim();
  if(v)e[f]=v;
  save();renderTeam();
});
$('.tabs').addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  showTab(b.id.replace('t-',''));
});
$('#auto').addEventListener('change',function(){autoHours=this.checked;save();renderTeam()});

/* clique no estúdio */
function toLogical(ev){var r=cv.getBoundingClientRect();return [(ev.clientX-r.left)/r.width*LW,(ev.clientY-r.top)/r.height*LH]}
function pick(pt){
  var best=null;
  everyone().forEach(function(e){
    if(!e.present||e.leaving)return;
    var inBody=e._hit&&pt[0]>=e._hit[0]&&pt[0]<=e._hit[0]+e._hit[2]&&pt[1]>=e._hit[1]&&pt[1]<=e._hit[1]+e._hit[3];
    var inPill=e._pill&&pt[0]>=e._pill[0]&&pt[0]<=e._pill[0]+e._pill[2]&&pt[1]>=e._pill[1]&&pt[1]<=e._pill[1]+e._pill[3];
    if((inBody||inPill)&&(!best||e.x+e.y>best.x+best.y))best=e;
  });
  return best;
}
cv.addEventListener('click',function(ev){var e=pick(toLogical(ev));if(e)select(e.id);else if(selId){selId=null;renderTeam()}});
cv.addEventListener('mousemove',function(ev){cv.style.cursor=pick(toLogical(ev))?'pointer':'default'});

/* ---------- início ---------- */
if(!load())seed();
$('#auto').checked=autoHours;
emps.forEach(function(e){runtime(e);setTarget(e,true)});
fit();
if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);else window.addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
renderAll();tick();
setInterval(tick,1000);
requestAnimationFrame(frame);
})();
</script>
